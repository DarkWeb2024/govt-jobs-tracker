name: daily-tracker

on:
  schedule:
    # four runs a day, IST -> UTC (IST = UTC+5:30):
    # 06:00 IST = 00:30 | 12:00 = 06:30 | 18:00 = 12:30 | 22:00 = 16:30
    - cron: "30 0,6,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          TRACKER_SMTP_USER: ${{ secrets.TRACKER_SMTP_USER }}
          TRACKER_SMTP_PASS: ${{ secrets.TRACKER_SMTP_PASS }}
          TRACKER_MS_CLIENT_ID: ${{ secrets.TRACKER_MS_CLIENT_ID }}
          TRACKER_CALLMEBOT_PHONE: ${{ secrets.TRACKER_CALLMEBOT_PHONE }}
          TRACKER_CALLMEBOT_APIKEY: ${{ secrets.TRACKER_CALLMEBOT_APIKEY }}
        run: python main.py

      - name: Commit refreshed site and data
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs Reports data/tracker.db data/organizations.json data/exams.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
